<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlashMapMaker</title>
<style>
:root{--bg:#14171c;--panel:#1c2027;--panel2:#262b35;--line:#313846;--text:#d7dce4;--dim:#8a93a3;--acc:#5aa2ff;--danger:#e0675a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:176px 1fr 244px;height:100%}
header{grid-column:1/4;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-size:14px;letter-spacing:.3px;margin-right:6px}
header label{display:flex;align-items:center;gap:6px;color:var(--dim)}
header .grow{flex:1}
.sep{width:1px;height:20px;background:var(--line)}
input[type=text],input[type=number]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font:inherit;min-width:0}
input[type=text]:focus,input[type=number]:focus{outline:1px solid var(--acc);border-color:var(--acc)}
#name{width:150px}
#gw,#gh{width:56px}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:#07101c;font-weight:600}
button.danger:hover{border-color:var(--danger);color:var(--danger)}
.chk{cursor:pointer;user-select:none}
.chk input{accent-color:var(--acc)}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;width:300px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.menu[hidden]{display:none}
.menu-h{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px}
.menu-h button{padding:2px 8px}
.menu-msg{padding:12px 10px;color:var(--dim)}
.menu-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}
.menu-item:last-child{border-bottom:0}
.menu-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-item .btns{display:flex;gap:6px;flex:none}
.menu-item .btns button{padding:3px 8px}
#tools{background:var(--panel);border-right:1px solid var(--line);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:4px}
#tools h4,#side h4{margin:10px 0 4px;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
#tools h4:first-child{margin-top:2px}
.tool{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px}
.tool .sw{width:12px;height:12px;border-radius:3px;flex:none}
.tool .k{margin-left:auto;color:var(--dim);font-size:11px}
.tool.active{border-color:var(--acc);background:#1d2f4a}
.help{color:var(--dim);font-size:11.5px;line-height:1.55}
.help b{color:var(--text);font-weight:600}
#stage{position:relative;min-width:0;min-height:0;background:#0f1216}
#cv{position:absolute;inset:0;display:block;touch-action:none}
#side{background:var(--panel);border-left:1px solid var(--line);padding:10px;overflow:auto}
#side h4:first-child{margin-top:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.row label{color:var(--dim)}
.row input[type=number]{width:64px}
.row input[type=text]{width:130px}
.row.btns{justify-content:flex-start;margin-top:12px}
.muted{color:var(--dim)}
footer{grid-column:1/4;display:flex;justify-content:space-between;gap:12px;padding:5px 12px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim);font-size:12px}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#0b0d11;border:1px solid var(--line);padding:8px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:80vw}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <strong class="logo">FlashMapMaker</strong>
    <label>Nombre <input type="text" id="name" maxlength="60" spellcheck="false"></label>
    <label>Tamaño <input type="number" id="gw" min="8" max="512"> × <input type="number" id="gh" min="8" max="512"> bloques</label>
    <span class="sep"></span>
    <button id="bUndo" title="Deshacer (Ctrl+Z)">↶</button>
    <button id="bRedo" title="Rehacer (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <button id="bNew">Nuevo</button>
    <button id="bImport">Importar</button>
    <button id="bExport" class="primary">Exportar JSON</button>
    <div class="dd">
      <button id="bRepo">Mapas del repo ▾</button>
      <div id="repoMenu" class="menu" hidden>
        <div class="menu-h"><span id="repoName"></span><button id="bRepoRefresh" title="Recargar lista">↻</button></div>
        <div id="repoList"></div>
      </div>
    </div>
    <span class="grow"></span>
    <label class="chk"><input type="checkbox" id="oGrid" checked> Rejilla</label>
    <label class="chk"><input type="checkbox" id="oLights"> Preview de luces</label>
    <label class="chk"><input type="checkbox" id="oChar"> Personaje</label>
  </header>

  <aside id="tools"></aside>
  <main id="stage"><canvas id="cv"></canvas></main>
  <aside id="side">
    <h4>Pieza seleccionada</h4>
    <div id="inspector"></div>
  </aside>

  <footer><span id="stL"></span><span id="stR"></span></footer>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="toast"></div>

<script>
'use strict';

// ==CORE== (sin DOM: se puede probar en Node)
const FORMAT_VERSION = 1;
const BLOCK_PX = 11;
const CELL_KEY = (x, y) => y * 1024 + x;

// Medidas en bloques. x,y = esquina superior izquierda, eje Y hacia abajo (como Godot).
const DEFS = {
  box_big:     { label: 'Caja grande',    w: 2, h: 2, color: '#8b6b3d' },
  box_small:   { label: 'Caja pequeña',   w: 2, h: 1, color: '#a98450' },
  light:       { label: 'Bombilla',       w: 1, h: 1, color: '#ffd54a' },
  door:        { label: 'Puerta',         w: 2, h: 5, color: '#4a8fd6' },
  weapon_base: { label: 'Base de arma',   w: 2, h: 1, color: '#d6584a' },
  spawn:       { label: 'Spawn jugador',  w: 1, h: 2, color: '#4ad67a' },
};

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function clampInt(v, min, max, def) {
  if (typeof v !== 'number' || !Number.isFinite(v)) return def;
  return clamp(Math.round(v), min, max);
}

function newModel(w = 96, h = 54) {
  return { name: 'mapa_nuevo', w, h, cells: new Map(), ents: [], nextId: 1 };
}

// Junta las celdas 1x1 en rectángulos grandes (primero en horizontal, luego en vertical).
function mergeRects(m, type) {
  const rows = new Map();
  for (const [k, t] of m.cells) {
    if (t !== type) continue;
    const y = Math.floor(k / 1024), x = k % 1024;
    if (!rows.has(y)) rows.set(y, []);
    rows.get(y).push(x);
  }
  const out = [];
  const active = new Map();
  for (const y of [...rows.keys()].sort((a, b) => a - b)) {
    const xs = rows.get(y).sort((a, b) => a - b);
    let i = 0;
    while (i < xs.length) {
      let j = i;
      while (j + 1 < xs.length && xs[j + 1] === xs[j] + 1) j++;
      const x = xs[i], w = j - i + 1, key = x + ',' + w;
      const r = active.get(key);
      if (r && r.y + r.h === y) r.h++;
      else { const nr = { x, y, w, h: 1 }; out.push(nr); active.set(key, nr); }
      i = j + 1;
    }
  }
  return out;
}

function modelToJSON(m) {
  return {
    version: FORMAT_VERSION,
    name: m.name,
    grid: { w: m.w, h: m.h, block_px: BLOCK_PX },
    tiles: { solid: mergeRects(m, 'solid'), platform: mergeRects(m, 'platform') },
    entities: m.ents.map(e => {
      const o = { type: e.type, x: e.x, y: e.y };
      if (e.type === 'door') { o.w = e.w; o.h = e.h; o.open = !!e.open; }
      if (e.type === 'light') o.on = e.on !== false;
      if (e.type === 'weapon_base' && e.item) o.item = e.item;
      return o;
    }),
  };
}

// JSON legible: cada rectángulo/entidad en una línea (diffs limpios en git).
function formatMap(j) {
  const line = o => JSON.stringify(o);
  const arr = (a, ind) => a.length ? '[\n' + a.map(o => ind + '  ' + line(o)).join(',\n') + '\n' + ind + ']' : '[]';
  return '{\n' +
    '  "version": ' + j.version + ',\n' +
    '  "name": ' + JSON.stringify(j.name) + ',\n' +
    '  "grid": ' + line(j.grid) + ',\n' +
    '  "tiles": {\n' +
    '    "solid": ' + arr(j.tiles.solid, '    ') + ',\n' +
    '    "platform": ' + arr(j.tiles.platform, '    ') + '\n' +
    '  },\n' +
    '  "entities": ' + arr(j.entities, '  ') + '\n' +
    '}\n';
}

function jsonToModel(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('No es un mapa válido');
  if (typeof d.version !== 'number') throw new Error('Al JSON le falta "version"');
  const warnings = [];
  if (d.version > FORMAT_VERSION) warnings.push('Es de la versión ' + d.version + ' y el editor llega hasta la ' + FORMAT_VERSION);
  const g = d.grid || {};
  const w = clampInt(g.w, 8, 512, 96), h = clampInt(g.h, 8, 512, 54);
  const m = newModel(w, h);
  m.name = String(d.name || 'mapa').slice(0, 60);

  let outside = 0;
  for (const type of ['solid', 'platform']) {
    const list = (d.tiles && Array.isArray(d.tiles[type])) ? d.tiles[type] : [];
    for (const r of list) {
      if (!r || typeof r !== 'object') continue;
      const x0 = r.x | 0, y0 = r.y | 0, rw = Math.max(1, r.w | 0), rh = Math.max(1, r.h | 0);
      for (let y = y0; y < y0 + rh; y++) for (let x = x0; x < x0 + rw; x++) {
        if (x < 0 || y < 0 || x >= w || y >= h) { outside++; continue; }
        m.cells.set(CELL_KEY(x, y), type);
      }
    }
  }

  let unknown = 0, moved = 0;
  for (const e of (Array.isArray(d.entities) ? d.entities : [])) {
    if (!e || typeof e !== 'object') continue;
    const def = DEFS[e.type];
    if (!def) { unknown++; continue; }
    const en = { id: m.nextId++, type: e.type, x: e.x | 0, y: e.y | 0, w: def.w, h: def.h };
    if (e.type === 'door') { en.w = clampInt(e.w, 1, 20, def.w); en.h = clampInt(e.h, 1, 30, def.h); en.open = !!e.open; }
    if (e.type === 'light') en.on = e.on !== false;
    if (e.type === 'weapon_base') en.item = typeof e.item === 'string' ? e.item.slice(0, 40) : '';
    const nx = clamp(en.x, 0, Math.max(0, w - en.w)), ny = clamp(en.y, 0, Math.max(0, h - en.h));
    if (nx !== en.x || ny !== en.y) moved++;
    en.x = nx; en.y = ny;
    m.ents.push(en);
  }
  if (outside) warnings.push(outside + ' bloques caían fuera del mapa y se han descartado');
  if (unknown) warnings.push(unknown + ' entidades de tipo desconocido ignoradas');
  if (moved) warnings.push(moved + ' piezas estaban fuera del mapa y se han metido dentro');
  return { model: m, warnings };
}
// ==/CORE==


// ---------------------------------------------------------------- editor
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const cv = $('#cv'), ctx = cv.getContext('2d'), stage = $('#stage');
const STORE_KEY = 'flashmapmaker.autosave.v1';
const LIGHT_PREVIEW_R = 7;      // solo preview: el alcance real se ajusta en Godot
const VALIDATE_ENABLED = false; // validación apagada por ahora
function validate(m) { return []; } // hueco para cuando se active

let dpr = 1;
let M = newModel();
let tool = 'select', drag = null, hover = null, spaceDown = false;
let selIds = new Set(), selCells = new Set(); // selección: piezas (por id) y bloques (por clave de celda)
let clip = null, pasting = false;             // portapapeles y modo "sello"
const CLIP_KEY = 'flashmapmaker.clip.v1';
const opts = { grid: true, lights: false, char: false };
const view = { ox: 20, oy: 20, s: 12 };

const TOOLS = [
  { id: 'select',      label: 'Seleccionar',    key: '1', color: '#5aa2ff' },
  { id: 'solid',       label: 'Suelo / pared',  key: '2', color: '#667085' },
  { id: 'platform',    label: 'Plataforma',     key: '3', color: '#d49b3a' },
  { id: 'box_big',     label: 'Caja grande',    key: '4', color: DEFS.box_big.color },
  { id: 'box_small',   label: 'Caja pequeña',   key: '5', color: DEFS.box_small.color },
  { id: 'light',       label: 'Bombilla',       key: '6', color: DEFS.light.color },
  { id: 'door',        label: 'Puerta',         key: '7', color: DEFS.door.color },
  { id: 'weapon_base', label: 'Base de arma',   key: '8', color: DEFS.weapon_base.color },
  { id: 'spawn',       label: 'Spawn jugador',  key: '9', color: DEFS.spawn.color },
  { id: 'erase',       label: 'Borrar',         key: '0', color: '#e0675a' },
];

const getEnt = id => M.ents.find(e => e.id === id);
const isEmpty = () => M.cells.size === 0 && M.ents.length === 0;
const clearSel = () => { selIds = new Set(); selCells = new Set(); };
const hasSel = () => selIds.size > 0 || selCells.size > 0;
const single = () => (selIds.size === 1 && selCells.size === 0) ? getEnt([...selIds][0]) : null; // una sola pieza → inspector

// ---- historial + autoguardado
const hist = { stack: [], i: -1 };
const snapshot = () => JSON.stringify(modelToJSON(M));
function autosave() { try { localStorage.setItem(STORE_KEY, snapshot()); } catch (e) {} }
function commit() {
  const s = snapshot();
  if (hist.stack[hist.i] !== s) {
    hist.stack.length = hist.i + 1;
    hist.stack.push(s);
    if (hist.stack.length > 150) hist.stack.shift();
    hist.i = hist.stack.length - 1;
  }
  autosave();
  refreshUI();
}
function restore(i) {
  hist.i = i;
  M = jsonToModel(JSON.parse(hist.stack[i])).model;
  clearSel(); pasting = false;
  autosave(); syncHeader(); refreshUI();
}
function undo() { if (hist.i > 0) restore(hist.i - 1); }
function redo() { if (hist.i < hist.stack.length - 1) restore(hist.i + 1); }

function replaceModel(model, fit) {
  M = model; clearSel(); pasting = false;
  syncHeader();
  if (fit) fitView();
  commit();
}

// ---- vista
function resize() {
  dpr = window.devicePixelRatio || 1;
  const r = stage.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  requestDraw();
}
function fitView() {
  const W = cv.clientWidth || 800, H = cv.clientHeight || 500;
  view.s = clamp(Math.min((W - 40) / M.w, (H - 40) / M.h), 2, 64);
  view.ox = (W - M.w * view.s) / 2;
  view.oy = (H - M.h * view.s) / 2;
  requestDraw();
}
let drawQueued = false;
function requestDraw() { if (!drawQueued) { drawQueued = true; requestAnimationFrame(() => { drawQueued = false; draw(); }); } }

function anchorFor(type, cx, cy) {
  const d = DEFS[type];
  return { x: clamp(cx - Math.floor((d.w - 1) / 2), 0, M.w - d.w), y: clamp(cy - d.h + 1, 0, M.h - d.h), w: d.w, h: d.h };
}

// ---- dibujo
const off = document.createElement('canvas');

function drawEnt(en, a) {
  const s = view.s, x = view.ox + en.x * s, y = view.oy + en.y * s, w = en.w * s, h = en.h * s;
  ctx.globalAlpha = a;
  if (en.type === 'light') {
    const on = en.on !== false;
    ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, s * 0.36, 0, Math.PI * 2);
    ctx.fillStyle = on ? '#ffd54a' : '#4b4f58'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = on ? '#fff3b0' : '#6b7280'; ctx.stroke();
  } else if (en.type === 'door') {
    ctx.fillStyle = en.open ? 'rgba(74,143,214,.16)' : 'rgba(74,143,214,.72)';
    ctx.fillRect(x, y, w, h);
    ctx.lineWidth = 2; ctx.strokeStyle = '#4a8fd6'; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    if (!en.open) { ctx.beginPath(); ctx.arc(x + w - s * 0.4, y + h / 2, Math.max(1.5, s * 0.14), 0, Math.PI * 2); ctx.fillStyle = '#cfe6ff'; ctx.fill(); }
  } else if (en.type === 'box_big' || en.type === 'box_small') {
    ctx.fillStyle = DEFS[en.type].color; ctx.fillRect(x, y, w, h);
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#4a361a'; ctx.strokeRect(x + .75, y + .75, w - 1.5, h - 1.5);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y + h); ctx.moveTo(x + w, y); ctx.lineTo(x, y + h);
    ctx.strokeStyle = 'rgba(74,54,26,.55)'; ctx.stroke();
  } else if (en.type === 'weapon_base') {
    ctx.fillStyle = 'rgba(214,88,74,.75)'; ctx.fillRect(x, y, w, h);
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#d6584a'; ctx.strokeRect(x + .75, y + .75, w - 1.5, h - 1.5);
    if (s >= 9) { ctx.fillStyle = '#fff'; ctx.font = Math.max(8, s * 0.5) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(en.item || 'arma', x + w / 2, y + h / 2, w - 4); }
  } else if (en.type === 'spawn') {
    ctx.fillStyle = 'rgba(74,214,122,.6)'; ctx.fillRect(x, y, w, h);
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#4ad67a'; ctx.strokeRect(x + .75, y + .75, w - 1.5, h - 1.5);
    if (s >= 9) { ctx.fillStyle = '#06210f'; ctx.font = 'bold ' + Math.max(8, s * 0.6) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('P', x + w / 2, y + h / 2); }
  }
  ctx.globalAlpha = 1;
}

function drawCell(t, px, py) {
  const s = view.s;
  if (t === 'solid') {
    ctx.fillStyle = '#667085'; ctx.fillRect(px, py, s, s);
    if (s >= 8) { ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1; ctx.strokeRect(px + .5, py + .5, s - 1, s - 1); }
  } else {
    ctx.fillStyle = 'rgba(212,155,58,.14)'; ctx.fillRect(px, py, s, s);
    ctx.fillStyle = '#d49b3a'; ctx.fillRect(px, py, s, Math.max(2, s * 0.3));
  }
}

function draw() {
  const W = cv.clientWidth, H = cv.clientHeight, s = view.s, ox = view.ox, oy = view.oy;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#1b2029'; ctx.fillRect(ox, oy, M.w * s, M.h * s);

  // rejilla
  if (opts.grid && s >= 6) {
    const x0 = Math.max(0, Math.floor(-ox / s)), x1 = Math.min(M.w, Math.ceil((W - ox) / s));
    const y0 = Math.max(0, Math.floor(-oy / s)), y1 = Math.min(M.h, Math.ceil((H - oy) / s));
    ctx.lineWidth = 1;
    for (let x = x0; x <= x1; x++) {
      ctx.strokeStyle = x % 10 === 0 ? 'rgba(255,255,255,.13)' : x % 5 === 0 ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.035)';
      const px = Math.round(ox + x * s) + .5; ctx.beginPath(); ctx.moveTo(px, oy + y0 * s); ctx.lineTo(px, oy + y1 * s); ctx.stroke();
    }
    for (let y = y0; y <= y1; y++) {
      ctx.strokeStyle = y % 10 === 0 ? 'rgba(255,255,255,.13)' : y % 5 === 0 ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.035)';
      const py = Math.round(oy + y * s) + .5; ctx.beginPath(); ctx.moveTo(ox + x0 * s, py); ctx.lineTo(ox + x1 * s, py); ctx.stroke();
    }
  }

  // bloques
  for (const [k, t] of M.cells) {
    const cx = k % 1024, cy = Math.floor(k / 1024), px = ox + cx * s, py = oy + cy * s;
    if (px + s < 0 || py + s < 0 || px > W || py > H) continue;
    drawCell(t, px, py);
  }

  // piezas (las bombillas van encima de la oscuridad)
  for (const en of M.ents) if (en.type !== 'light') drawEnt(en, 1);

  if (opts.lights) {
    if (off.width !== cv.width || off.height !== cv.height) { off.width = cv.width; off.height = cv.height; }
    const o = off.getContext('2d');
    o.setTransform(dpr, 0, 0, dpr, 0, 0);
    o.globalCompositeOperation = 'source-over';
    o.clearRect(0, 0, W, H);
    o.fillStyle = 'rgba(4,6,14,.8)'; o.fillRect(ox, oy, M.w * s, M.h * s);
    o.globalCompositeOperation = 'destination-out';
    for (const en of M.ents) {
      if (en.type !== 'light' || en.on === false) continue;

  if (n) commit(); else toast('No hay luces que cambiar');
}

function syncHeader() { $('#name').value = M.name; $('#gw').value = M.w; $('#gh').value = M.h; }

function updateStatus() {
  const cnt = t => M.ents.filter(e => e.type === t).length;
  const pos = hover && hover.cx >= 0 && hover.cy >= 0 && hover.cx < M.w && hover.cy < M.h ? `x ${hover.cx}, y ${hover.cy}` : '—';
  $('#stL').textContent = `${pos}  ·  ${M.w}×${M.h} bloques (${M.w * BLOCK_PX}×${M.h * BLOCK_PX} px)  ·  zoom ${view.s.toFixed(1)}`;
  $('#stR').textContent = `spawns ${cnt('spawn')} · armas ${cnt('weapon_base')} · luces ${cnt('light')} · puertas ${cnt('door')} · cajas ${cnt('box_big') + cnt('box_small')}`;
}

function renderInspector() {
  const box = $('#inspector'), en = single();
  const pasteBtn = clip ? '<button id="bPaste">Pegar (Ctrl+V)</button>' : '';
  const wire = (id, fn) => { const b = $(id); if (b) b.onclick = fn; };
  if (!en) {
    if (!hasSel()) {
      box.innerHTML = '<div class="muted">Nada seleccionado. Con <b>Seleccionar (1)</b> haz click en una pieza o arrastra para marcar varias.</div>' + (pasteBtn ? '<div class="row btns">' + pasteBtn + '</div>' : '');
    } else {
      box.innerHTML = `<div class="row"><strong>Selección</strong></div><div class="muted">${selIds.size} piezas · ${selCells.size} bloques</div>` +
        '<div class="row btns"><button id="bCopy">Copiar</button><button id="bCut">Cortar</button><button id="bDel" class="danger">Borrar</button></div>' +
        (pasteBtn ? '<div class="row btns">' + pasteBtn + '</div>' : '');
    }
    wire('#bPaste', startPaste); wire('#bCopy', copySelection); wire('#bCut', cutSelection); wire('#bDel', deleteSelected);
    return;
  }
  const d = DEFS[en.type];
  let h = `<div class="row"><strong>${esc(d.label)}</strong><span class="muted">${en.w}×${en.h}</span></div>`;
  h += `<div class="row"><label>x</label><input type="number" data-f="x" value="${en.x}"><label>y</label><input type="number" data-f="y" value="${en.y}"></div>`;
  if (en.type === 'light') h += `<div class="row"><label for="fOn">Encendida</label><input type="checkbox" id="fOn" data-f="on" ${en.on !== false ? 'checked' : ''}></div><div class="muted">Potencia y alcance se ajustan en Godot.</div>`;
  if (en.type === 'door') h += `<div class="row"><label>ancho</label><input type="number" data-f="w" min="1" max="20" value="${en.w}"><label>alto</label><input type="number" data-f="h" min="1" max="30" value="${en.h}"></div>
    <div class="row"><label for="fOpen">Abierta</label><input type="checkbox" id="fOpen" data-f="open" ${en.open ? 'checked' : ''}></div><div class="muted">Los mapas actuales usan 2×5.</div>`;
  if (en.type === 'weapon_base') h += `<div class="row"><label>Objeto</label><input type="text" data-f="item" maxlength="40" placeholder="(vacío = al azar)" value="${esc(en.item || '')}"></div>`;
  h += '<div class="row btns"><button id="bDup">Duplicar</button><button id="bCopy">Copiar</button><button id="bDel" class="danger">Borrar</button></div>';
  if (pasteBtn) h += '<div class="row btns">' + pasteBtn + '</div>';
  box.innerHTML = h;
  $('#bDup').onclick = () => {
    const c = { ...en, id: M.nextId++ };
    c.x = clamp(en.x + en.w, 0, M.w - en.w); c.y = en.y;
    M.ents.push(c); selIds = new Set([c.id]); selCells = new Set(); commit();
  };
  wire('#bCopy', copySelection); wire('#bPaste', startPaste); wire('#bDel', deleteSelected);
}
$('#inspector').addEventListener('change', e => {
  const en = single(), f = e.target.dataset && e.target.dataset.f;
  if (!en || !f) return;
  if (f === 'on' || f === 'open') en[f] = e.target.checked;
  else if (f === 'item') en.item = String(e.target.value).slice(0, 40);
  else {
    const v = Math.round(Number(e.target.value));
    if (!Number.isFinite(v)) { refreshUI(); return; }
    en[f] = f === 'w' ? clamp(v, 1, Math.min(20, M.w)) : f === 'h' ? clamp(v, 1, Math.min(30, M.h)) : v;
    en.x = clamp(en.x, 0, M.w - en.w); en.y = clamp(en.y, 0, M.h - en.h);
  }
  commit();
});

function refreshUI() {
  $('#bUndo').disabled = hist.i <= 0;
  $('#bRedo').disabled = hist.i >= hist.stack.length - 1;
  renderInspector(); updateStatus(); requestDraw();
}

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}

// ---- cabecera
$('#name').addEventListener('input', e => { M.name = e.target.value.slice(0, 60); autosave(); });
$('#name').addEventListener('change', () => commit());
function resizeMap() {
  const w = clampInt(Number($('#gw').value), 8, 512, M.w), h = clampInt(Number($('#gh').value), 8, 512, M.h);
  if (w === M.w && h === M.h) { syncHeader(); return; }
  const outCells = [...M.cells.keys()].filter(k => k % 1024 >= w || Math.floor(k / 1024) >= h).length;
  const outEnts = M.ents.filter(e => e.x + e.w > w || e.y + e.h > h).length;
  if ((outCells || outEnts) && !confirm(`Al reducir el mapa se pierden ${outCells} bloques y ${outEnts} piezas que quedan fuera. ¿Seguir?`)) { syncHeader(); return; }
  for (const k of [...M.cells.keys()]) if (k % 1024 >= w || Math.floor(k / 1024) >= h) M.cells.delete(k);
  M.ents = M.ents.filter(e => e.x + e.w <= w && e.y + e.h <= h);
  M.w = w; M.h = h; clearSel(); syncHeader(); commit();
}
$('#gw').addEventListener('change', resizeMap);
$('#gh').addEventListener('change', resizeMap);
$('#bUndo').onclick = undo;
$('#bRedo').onclick = redo;
$('#bNew').onclick = () => {
  if (!isEmpty() && !confirm('¿Empezar un mapa nuevo? El actual se puede recuperar con Deshacer.')) return;
  replaceModel(newModel(M.w, M.h), true);
};
$('#oGrid').onchange = e => { opts.grid = e.target.checked; requestDraw(); };
$('#oLights').onchange = e => { opts.lights = e.target.checked; requestDraw(); };
$('#oChar').onchange = e => { opts.char = e.target.checked; requestDraw(); };

// ---- importar / exportar
function loadFromText(text, label) {
  let model, warnings;
  try { ({ model, warnings } = jsonToModel(JSON.parse(text))); }
  catch (err) { toast('No se pudo abrir' + (label ? ' «' + label + '»' : '') + ': ' + err.message); return false; }
  replaceModel(model, true);
  toast(warnings.length ? warnings.join(' · ') : 'Mapa cargado');
  return true;
}
$('#bImport').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (!isEmpty() && !confirm('Esto reemplaza el mapa actual (se puede deshacer). ¿Seguir?')) return;
  loadFromText(await f.text(), f.name);
};
$('#bExport').onclick = () => {
  if (VALIDATE_ENABLED) { const p = validate(M); if (p.length) toast(p.join(' · ')); }
  downloadText(formatMap(modelToJSON(M)), safeName(M.name) + '.json');
};
const safeName = n => n.trim().replace(/[^\w.-]+/g, '_') || 'mapa';
function downloadText(text, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ---- mapas del repo
function detectRepo() {
  const q = new URLSearchParams(location.search).get('repo');
  if (q && /^[\w.-]+\/[\w.-]+$/.test(q)) { const [owner, name] = q.split('/'); return { owner, name }; }
  if (location.hostname.endsWith('.github.io')) {
    const owner = location.hostname.split('.')[0], name = location.pathname.split('/')[1];
    if (name) return { owner, name };
  }
  return { owner: 'xNeku', name: 'FlashMapMaker' };
}
const REPO = detectRepo();
let repoLoaded = false;
function closeMenu() { $('#repoMenu').hidden = true; }
async function loadRepoList() {
  const list = $('#repoList');
  list.innerHTML = '<div class="menu-msg">Cargando…</div>';
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.name}/contents/maps`, { headers: { Accept: 'application/vnd.github+json' } });
    if (r.status === 404) { list.innerHTML = '<div class="menu-msg">Todavía no hay carpeta <b>maps/</b> en el repo (o el repo es privado).</div>'; return; }
    if (r.status === 403) { list.innerHTML = '<div class="menu-msg">GitHub ha limitado las peticiones. Prueba en unos minutos.</div>'; return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const files = (await r.json()).filter(f => f.type === 'file' && /\.json$/i.test(f.name)).sort((a, b) => a.name.localeCompare(b.name));
    if (!files.length) { list.innerHTML = '<div class="menu-msg">No hay mapas .json en <b>maps/</b>.</div>'; return; }
    list.innerHTML = '';
    for (const f of files) {
      const row = document.createElement('div'); row.className = 'menu-item';
      const nm = document.createElement('span'); nm.textContent = f.name.replace(/\.json$/i, ''); nm.title = f.name;
      const btns = document.createElement('div'); btns.className = 'btns';
      const b = document.createElement('button'); b.textContent = 'Abrir copia'; b.title = 'Abrirlo en el editor como copia';
      b.onclick = () => openRepoMap(f);
      const dl = document.createElement('button'); dl.textContent = 'Descargar'; dl.title = 'Guardar una copia en tu PC';
      dl.onclick = () => downloadRepoMap(f);
      btns.append(b, dl);
      row.append(nm, btns); list.appendChild(row);
    }
    repoLoaded = true;
  } catch (err) {
    list.innerHTML = '<div class="menu-msg">No se pudo leer el repo: ' + esc(err.message) + '</div>';
  }
}
async function openRepoMap(f) {
  if (!isEmpty() && !confirm('Esto reemplaza el mapa actual (se puede deshacer). ¿Seguir?')) return;
  try {
    const r = await fetch(f.download_url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const { model, warnings } = jsonToModel(await r.json());
    const base = (model.name || f.name.replace(/\.json$/i, '')).replace(/_copia$/, '');
    model.name = (base + '_copia').slice(0, 60);
    replaceModel(model, true);
    closeMenu();
    toast('«' + base + '» abierto como copia. Al exportar se guarda como ' + model.name + '.json' + (warnings.length ? ' · ' + warnings.join(' · ') : ''));
  } catch (err) { toast('No se pudo abrir ' + f.name + ': ' + err.message); }
}
async function downloadRepoMap(f) {
  try {
    const r = await fetch(f.download_url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const { model } = jsonToModel(await r.json());
    const base = (model.name || f.name.replace(/\.json$/i, '')).replace(/_copia$/, '');
    model.name = (base + '_copia').slice(0, 60);
    downloadText(formatMap(modelToJSON(model)), safeName(model.name) + '.json');
    toast('Descargado ' + safeName(model.name) + '.json (mira en Descargas)');
  } catch (err) { toast('No se pudo descargar ' + f.name + ': ' + err.message); }
}
$('#repoName').textContent = REPO.owner + '/' + REPO.name + ' · maps/';
$('#bRepo').onclick = e => {
  e.stopPropagation();
  const m = $('#repoMenu'); m.hidden = !m.hidden;
  if (!m.hidden && !repoLoaded) loadRepoList();
};
$('#bRepoRefresh').onclick = e => { e.stopPropagation(); loadRepoList(); };
document.addEventListener('click', e => { if (!e.target.closest('.dd')) closeMenu(); });

// ---- arranque
(function init() {
  buildTools(); setTool('select');
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) M = jsonToModel(JSON.parse(raw)).model;
  } catch (e) { M = newModel(); }
  hist.stack = [snapshot()]; hist.i = 0;
  loadClip();
  syncHeader(); resize(); fitView(); refreshUI();
  new ResizeObserver(resize).observe(stage);
})();
</script>
</body>
